<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balkan Media – Aplikacije</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family: 'Montserrat', sans-serif;
  margin:0;
  background: linear-gradient(135deg, #1f1c2c, #928dab);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:520px;
  width:100%;
  text-align:center;
}

/* INTRO LOGO I TEKST */
.intro{
  background:linear-gradient(90deg,#ff4ecd,#ff7adf);
  padding:22px;
  border-radius:18px;
  text-align:center;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.intro .logo {
  width:100px;
  height:100px;
  margin-bottom:15px;
  animation: blink 5s linear infinite;
}

.intro h1{
  margin:0 0 10px;
  font-size:26px;
  font-weight:700;
}

.intro p{
  margin:0;
  font-size:16px;
  line-height:1.5;
}

/* APLIKACIJE */
.app{
  background:rgba(255,255,255,.1);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  text-align:center;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
}

.app img{
  width:80px;
  height:80px;
  object-fit:contain;
  margin-bottom:10px;
}

.app h3{
  margin:6px 0 14px;
  font-size:18px;
  font-weight:600;
}

.btn{
  display:inline-block;
  padding:13px 25px;
  border-radius:14px;
  background:linear-gradient(135deg,#ff4ecd,#ff7adf);
  color:#fff;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  text-decoration:none;
  user-select:none;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
}

/* FOOTER */
.footer{
  text-align:center;
  opacity:.7;
  font-size:13px;
  margin-top:22px;
}

/* Animacija treptanja loga */
@keyframes blink {
  0%,50%,100% { opacity: 1; }
  25%,75% { opacity: 0.2; }
}

/* MOBILE */
@media(max-width:600px){
  .intro .logo { width:70px; height:70px; }
  .intro h1 { font-size:22px; }
}
</style>
</head>

<body>

<div class="container">

  <div class="intro">
    <!-- LOGO iznad naslova -->
    <img src="images/edfc160d-608b-42ec-b685-d1404131fbf4.png" alt="Balkan Media Logo" class="logo">
    <h1>Balkan Media</h1>
    <p>Ovde možete pronaći naše WINDOWS aplikacije.<br>
    Kliknite na dugme ispod da započnete preuzimanje.</p>
  </div>

  <div class="app">
    <img src="images/aladin.png" alt="Aladin">
    <h3>Aladin</h3>
    <a href="https://primer-link.com/aladin.apk" class="btn" target="_blank">Preuzmi</a>
  </div>

  <div class="app">
    <img src="images/iboplayerpremium.png" alt="IBO Player">
    <h3>IBO Player Premium</h3>
    <a href="https://www.megadisk.net/cloud11/index.php/s/iun95LMFYPVpqw6/download" class="btn" target="_blank">Preuzmi</a>
  </div>

  <div class="app">
    <img src="images/ibplayerpro.png" alt="IBO Player Pro">
    <h3>IB Player Pro</h3>
    <a href="https://www.megadisk.net/cloud11/index.php/s/IFrfjGu2iLqlszn/download" class="btn" target="_blank">Preuzmi</a>
  </div>

  <div class="app">
    <img src="images/vuplayerpro.png" alt="VU Player Pro">
    <h3>VU Player Pro</h3>
    <a href="https://www.megadisk.net/cloud11/index.php/s/VQLL2aFQvO7ey8d/download" class="btn" target="_blank">Preuzmi</a>
  </div>

  <div class="footer">© Balkan Media</div>

</div>
</body>
</html>
